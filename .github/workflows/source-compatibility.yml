name: Source Compatibility

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  natural-earth-110m-land-probe:
    name: Natural Earth v5.1.2 / byte identity probe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch pinned upstream bytes
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/natural-earth-v5.1.2"
          mkdir -p "$root"
          base="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/110m_physical"
          for file in ne_110m_land.shp ne_110m_land.prj ne_110m_land.VERSION.txt; do
            curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
              --output "$root/$file" "$base/$file"
          done

      - name: Print byte identities
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/natural-earth-v5.1.2"
          echo '--- SHA-256 ---'
          sha256sum "$root/ne_110m_land.shp" "$root/ne_110m_land.prj" "$root/ne_110m_land.VERSION.txt"
          echo '--- byte sizes ---'
          wc -c "$root/ne_110m_land.shp" "$root/ne_110m_land.prj" "$root/ne_110m_land.VERSION.txt"
          echo '--- VERSION.txt ---'
          cat "$root/ne_110m_land.VERSION.txt"
