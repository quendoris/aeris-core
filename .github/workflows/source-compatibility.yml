name: Source Compatibility

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-compatibility.yml
      - compat/natural-earth/**
      - tools/real_world_probe.cpp
      - tools/real_world_globe_probe.cpp
      - tools/shapefile_projection_probe.cpp
      - CMakeLists.txt
      - include/aeris/source/**
      - src/source/**
      - include/aeris/geometry/**
      - src/geometry/**
      - include/aeris/projection/**
      - src/projection/**
      - include/aeris/view/**
      - src/view/**
  pull_request:
    paths:
      - .github/workflows/source-compatibility.yml
      - compat/natural-earth/**
      - tools/real_world_probe.cpp
      - tools/real_world_globe_probe.cpp
      - tools/shapefile_projection_probe.cpp
      - CMakeLists.txt
      - include/aeris/source/**
      - src/source/**
      - include/aeris/geometry/**
      - src/geometry/**
      - include/aeris/projection/**
      - src/projection/**
      - include/aeris/view/**
      - src/view/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  natural-earth-110m-land:
    name: Natural Earth v5.1.2 / verified real-world proof
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch pinned upstream bytes
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/natural-earth-v5.1.2"
          mkdir -p "$root"
          base="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/f1890d9f152c896d250a77557a5751a93d494776/110m_physical"
          for file in ne_110m_land.shp ne_110m_land.prj ne_110m_land.VERSION.txt; do
            curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
              --output "$root/$file" "$base/$file"
          done

      - name: Build integration probes
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-compat \
            -DAERIS_BUILD_TESTS=OFF \
            -DAERIS_BUILD_TOOLS=ON \
            -DAERIS_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-compat \
            --target aeris_real_world_probe aeris_real_world_globe_probe aeris_shapefile_projection_probe \
            --parallel 2

      - name: Diagnose projection convergence
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/natural-earth-v5.1.2"
          ./build-compat/aeris_shapefile_projection_probe \
            "$root/ne_110m_land.shp" 3 0

      - name: Diagnose polar winding geometry
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/natural-earth-v5.1.2"
          ./build-compat/aeris_shapefile_projection_probe \
            "$root/ne_110m_land.shp" 8 0

      - name: Verify, normalize, project, and render
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/natural-earth-v5.1.2"
          retrieved_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ./build-compat/aeris_real_world_probe \
            "$root" \
            compat/natural-earth/ne_110m_land-v5.1.2 \
            "$RUNNER_TEMP/aeris-natural-earth-v5.1.2.svg" \
            "$retrieved_at"

      - name: Verify real-world globe horizon topology
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/natural-earth-v5.1.2"
          ./build-compat/aeris_real_world_globe_probe \
            "$root/ne_110m_land.shp" \
            "$RUNNER_TEMP/aeris-natural-earth-v5.1.2-globe.svg"

      - name: Upload diagnostic SVGs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aeris-natural-earth-v5.1.2
          path: |
            ${{ runner.temp }}/aeris-natural-earth-v5.1.2.svg
            ${{ runner.temp }}/aeris-natural-earth-v5.1.2-globe.svg
          if-no-files-found: error
          retention-days: 14
