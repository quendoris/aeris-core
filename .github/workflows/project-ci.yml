name: Project CI

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'include/aeris/project/**'
      - 'src/project/**'
      - 'include/aeris/source/**'
      - 'src/source/**'
      - 'include/aeris/storage/**'
      - 'src/storage/**'
      - 'include/aeris/util/text.hpp'
      - 'compat/natural-earth/**'
      - 'tools/project_natural_earth_probe.cpp'
      - 'tools/project_natural_earth_admin0_probe.cpp'
      - 'tests/CMakeLists.txt'
      - 'tests/test_project_source_bridge.cpp'
      - 'tests/test_project_feature_property_bridge.cpp'
      - '.github/workflows/project-ci.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'include/aeris/project/**'
      - 'src/project/**'
      - 'include/aeris/source/**'
      - 'src/source/**'
      - 'include/aeris/storage/**'
      - 'src/storage/**'
      - 'include/aeris/util/text.hpp'
      - 'compat/natural-earth/**'
      - 'tools/project_natural_earth_probe.cpp'
      - 'tools/project_natural_earth_admin0_probe.cpp'
      - 'tests/CMakeLists.txt'
      - 'tests/test_project_source_bridge.cpp'
      - 'tests/test_project_feature_property_bridge.cpp'
      - '.github/workflows/project-ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / project bridge
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SQLite development package (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install SQLite development package (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite
          echo "CMAKE_PREFIX_PATH=$(brew --prefix sqlite)" >> "$GITHUB_ENV"

      - name: Install SQLite development package (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install sqlite3:x64-windows

      - name: Reject project layer without storage
        if: runner.os == 'Linux'
        run: |
          if cmake -S . -B build-project-invalid \
            -DAERIS_BUILD_STORAGE=OFF \
            -DAERIS_BUILD_PROJECT=ON \
            -DAERIS_BUILD_TESTS=OFF \
            -DAERIS_BUILD_TOOLS=OFF; then
            echo "AERIS_BUILD_PROJECT unexpectedly configured without AERIS_BUILD_STORAGE"
            exit 1
          fi

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build-project
          -DAERIS_BUILD_STORAGE=ON
          -DAERIS_BUILD_PROJECT=ON
          -DAERIS_BUILD_TESTS=ON
          -DAERIS_BUILD_TOOLS=OFF
          -DAERIS_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build-project
          -DAERIS_BUILD_STORAGE=ON
          -DAERIS_BUILD_PROJECT=ON
          -DAERIS_BUILD_TESTS=ON
          -DAERIS_BUILD_TOOLS=OFF
          -DAERIS_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build project bridge contract tests
        run: cmake --build build-project --target aeris_test_project_source_bridge aeris_test_project_feature_property_bridge --config Release --parallel 2

      - name: Test project bridge contracts
        run: ctest --test-dir build-project --build-config Release --output-on-failure -R '^(project_source_bridge|project_feature_property_bridge)$'

  natural-earth-project:
    name: Natural Earth v5.1.2 / durable project proof
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SQLite development package
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Fetch exact pinned Natural Earth bytes
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/natural-earth-v5.1.2"
          mkdir -p "$root"
          base="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/f1890d9f152c896d250a77557a5751a93d494776/110m_physical"
          for file in ne_110m_land.shp ne_110m_land.prj ne_110m_land.VERSION.txt; do
            curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
              --output "$root/$file" "$base/$file"
          done

      - name: Configure real-world project probe
        run: >-
          cmake -S . -B build-project-real
          -DAERIS_BUILD_STORAGE=ON
          -DAERIS_BUILD_PROJECT=ON
          -DAERIS_BUILD_TESTS=OFF
          -DAERIS_BUILD_TOOLS=ON
          -DAERIS_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build real-world project probe
        run: cmake --build build-project-real --target aeris_project_natural_earth_probe --parallel 2

      - name: Verify, persist, reopen, and compare every canonical feature
        shell: bash
        run: |
          set -euo pipefail
          retrieved_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ./build-project-real/aeris_project_natural_earth_probe \
            "$RUNNER_TEMP/natural-earth-v5.1.2" \
            compat/natural-earth/ne_110m_land-v5.1.2 \
            "$RUNNER_TEMP/natural-earth-v5.1.2.aeris" \
            "$retrieved_at"

  natural-earth-admin0-project:
    name: Natural Earth v5.1.2 / durable admin0 property proof
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SQLite development package
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Fetch exact pinned admin0 bytes
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/natural-earth-admin0-v5.1.2"
          mkdir -p "$root"
          base="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/f1890d9f152c896d250a77557a5751a93d494776/110m_cultural"
          for file in \
            ne_110m_admin_0_countries.shp \
            ne_110m_admin_0_countries.dbf \
            ne_110m_admin_0_countries.cpg \
            ne_110m_admin_0_countries.prj \
            ne_110m_admin_0_countries.VERSION.txt; do
            curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
              --output "$root/$file" "$base/$file"
          done

      - name: Configure admin0 durable project proof
        run: >-
          cmake -S . -B build-project-admin0
          -DAERIS_BUILD_STORAGE=ON
          -DAERIS_BUILD_PROJECT=ON
          -DAERIS_BUILD_TESTS=OFF
          -DAERIS_BUILD_TOOLS=ON
          -DAERIS_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build admin0 durable project proof
        run: cmake --build build-project-admin0 --target aeris_project_natural_earth_admin0_probe --parallel 2

      - name: Verify, persist, reopen, and compare complete admin0 properties
        shell: bash
        run: |
          set -euo pipefail
          retrieved_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ./build-project-admin0/aeris_project_natural_earth_admin0_probe \
            "$RUNNER_TEMP/natural-earth-admin0-v5.1.2" \
            "$RUNNER_TEMP/natural-earth-admin0-v5.1.2.aeris" \
            "$retrieved_at"

  sanitizers:
    name: Linux / project bridge ASan + UBSan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SQLite development package
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Configure
        run: >-
          cmake -S . -B build-project-sanitize
          -DAERIS_BUILD_STORAGE=ON
          -DAERIS_BUILD_PROJECT=ON
          -DAERIS_BUILD_TESTS=ON
          -DAERIS_BUILD_TOOLS=OFF
          -DAERIS_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined\ -fno-omit-frame-pointer
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined

      - name: Build project bridge contract tests
        run: cmake --build build-project-sanitize --target aeris_test_project_source_bridge aeris_test_project_feature_property_bridge --parallel 2

      - name: Test project bridge contracts
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-project-sanitize --output-on-failure -R '^(project_source_bridge|project_feature_property_bridge)$'
